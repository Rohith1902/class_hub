services:
  postgres:
    image: postgres:16-alpine
    container_name: classhub-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: classhub
      POSTGRES_PASSWORD: classhub
      POSTGRES_DB: classhub
    volumes:
      - classhub_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U classhub -d classhub"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  classhub_pg_data:
