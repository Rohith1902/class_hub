<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Classhub — Find trusted tutors in Chennai</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">

<!-- Optional: real Razorpay test-mode checkout. No other libraries are used anywhere in this file. -->
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<style>
  /* ---------- Design tokens ---------- */
  :root{
    --cream:#FBF6EC; --paper:#FFFDF8; --ink:#1E2B29;
    --teal-50:#EAF3F1; --teal-100:#D2E6E1; --teal-300:#5C9C92; --teal-400:#2E8177;
    --teal-500:#12645C; --teal-600:#0F5652; --teal-700:#0A3F3B; --teal-900:#052723;
    --marigold-50:#FDF4E2; --marigold-100:#FCE9C6; --marigold-300:#F2BE6C;
    --marigold-500:#E8963C; --marigold-600:#CC7A22; --marigold-700:#A05F19;
    --brick-500:#C4562B; --brick-600:#A5431F;
    --ink-05:rgba(30,43,41,.05); --ink-10:rgba(30,43,41,.10); --ink-15:rgba(30,43,41,.15);
    --ink-30:rgba(30,43,41,.30); --ink-40:rgba(30,43,41,.40); --ink-50:rgba(30,43,41,.50);
    --ink-60:rgba(30,43,41,.60); --ink-70:rgba(30,43,41,.70);
    --shadow-card: 0 1px 2px rgba(30,43,41,.06), 0 8px 24px -12px rgba(30,43,41,.18);
    --radius-lg: 16px; --radius-xl: 20px;
  }
  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{
    margin:0; background:var(--cream); color:var(--ink);
    font-family:"Inter",sans-serif; -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--marigold-300); color:var(--teal-900); }
  h1,h2,h3,.display{ font-family:"Fraunces",serif; margin:0; }
  .mono{ font-family:"JetBrains Mono",monospace; }
  a,button,select,input,textarea{ font-family:inherit; }
  button{ cursor:pointer; }
  img{ max-width:100%; display:block; }
  .container{ max-width:1152px; margin:0 auto; padding:0 16px; }
  @media(min-width:640px){ .container{ padding:0 24px; } }

  /* focus ring, keyboard visible */
  .fring:focus-visible{ outline:2px solid var(--marigold-500); outline-offset:2px; border-radius:8px; }

  @media (prefers-reduced-motion: reduce){ *{ animation-duration:.001ms !important; transition-duration:.001ms !important; } }

  /* ---------- Buttons ---------- */
  .btn{ border:none; border-radius:12px; font-weight:600; font-size:14px; padding:12px 20px; display:inline-flex; align-items:center; justify-content:center; gap:8px; }
  .btn-primary{ background:var(--teal-600); color:var(--cream); box-shadow:var(--shadow-card); }
  .btn-primary:hover{ background:var(--teal-700); }
  .btn-primary:disabled{ background:var(--ink-15); color:var(--ink-40); cursor:not-allowed; }
  .btn-accent{ background:var(--marigold-500); color:var(--teal-900); font-weight:700; box-shadow:var(--shadow-card); }
  .btn-accent:hover{ background:var(--marigold-600); }
  .btn-ghost{ background:var(--teal-50); color:var(--teal-700); }
  .btn-ghost:hover{ background:var(--teal-100); }
  .btn-outline{ background:transparent; border:1px solid var(--ink-15); color:var(--ink-70); }
  .btn-razorpay{ background:#3395FF; color:#fff; width:100%; }
  .btn-razorpay:hover{ background:#1c85f7; }
  .btn-block{ width:100%; }

  /* ---------- Header / nav ---------- */
  header.topnav{ position:sticky; top:0; z-index:40; background:rgba(251,246,236,.95); backdrop-filter:blur(6px); border-bottom:1px solid var(--ink-10); }
  .topnav-inner{ height:64px; display:flex; align-items:center; justify-content:space-between; }
  .logo{ font-family:"Fraunces",serif; font-weight:600; font-size:20px; letter-spacing:-.01em; background:none; border:none; color:var(--ink); padding:6px; }
  .logo span{ color:var(--marigold-500); }
  .nav-links{ display:none; gap:4px; }
  .nav-link{ background:none; border:none; padding:8px 12px; border-radius:999px; font-size:14px; font-weight:500; color:var(--ink-70); }
  .nav-link.active{ background:var(--teal-50); color:var(--teal-700); }
  .nav-actions{ display:none; align-items:center; gap:8px; }
  .hamburger{ display:inline-flex; background:none; border:none; padding:8px; margin-right:-8px; }
  @media(min-width:768px){
    .nav-links,.nav-actions{ display:flex; }
    .hamburger{ display:none; }
  }
  .mobile-menu{ border-top:1px solid var(--ink-10); background:var(--paper); padding:12px 16px; display:none; }
  .mobile-menu.open{ display:block; }
  .mobile-menu-item{ display:block; width:100%; text-align:left; background:none; border:none; padding:10px 12px; border-radius:10px; font-size:14px; font-weight:500; color:var(--ink-70); }
  .mobile-menu-item:hover{ background:var(--teal-50); }
  .mobile-menu-row{ display:flex; gap:8px; padding-top:8px; }

  /* ---------- Mobile bottom tab bar ---------- */
  .tabbar{ display:grid; grid-template-columns:repeat(4,1fr); position:fixed; bottom:0; left:0; right:0; z-index:40; background:var(--paper); border-top:1px solid var(--ink-10); padding-bottom:env(safe-area-inset-bottom); }
  .tabbar button{ background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:2px; padding:10px 0; font-size:11px; font-weight:500; color:var(--ink-50); }
  .tabbar button.active{ color:var(--teal-700); }
  .tabbar svg{ width:20px; height:20px; }
  @media(min-width:768px){ .tabbar{ display:none; } }
  .tabbar-spacer{ height:64px; }
  @media(min-width:768px){ .tabbar-spacer{ display:none; } }

  /* ---------- Hero / home ---------- */
  .hero{ padding:40px 0 24px; background-image:repeating-linear-gradient(to bottom, transparent, transparent 27px, rgba(30,43,41,.07) 28px); }
  @media(min-width:640px){ .hero{ padding:64px 0 24px; } }
  .eyebrow{ display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:var(--teal-700); background:var(--teal-50); border:1px solid var(--teal-100); border-radius:999px; padding:4px 12px; }
  .hero h1{ font-weight:600; font-size:36px; line-height:1.1; margin-top:16px; max-width:640px; }
  @media(min-width:640px){ .hero h1{ font-size:48px; } }
  .hero p{ margin-top:16px; color:var(--ink-60); font-size:16px; line-height:1.6; max-width:600px; }
  @media(min-width:640px){ .hero p{ font-size:18px; } }
  .chips{ display:flex; flex-wrap:wrap; gap:8px; margin-top:24px; }
  .chip{ font-size:12px; font-weight:500; padding:6px 12px; border-radius:999px; background:var(--paper); border:1px solid var(--ink-10); color:var(--ink-60); }
  .chip:hover{ border-color:var(--teal-300); color:var(--teal-700); }

  .search-box{ background:var(--paper); border-radius:var(--radius-xl); box-shadow:var(--shadow-card); border:1px solid var(--ink-10); padding:14px; margin-top:32px; }
  .search-grid{ display:grid; gap:8px; grid-template-columns:1fr; }
  @media(min-width:640px){ .search-grid{ grid-template-columns:1.2fr 1fr 1fr auto; } }
  .field{ position:relative; }
  .field select, .field input[type=text]{ width:100%; padding:12px 12px 12px 36px; border-radius:12px; background:var(--cream); border:1px solid var(--ink-10); font-size:14px; appearance:none; color:var(--ink); }
  .field svg.field-icon{ position:absolute; left:12px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:var(--ink-40); }
  .field-label-row{ display:flex; justify-content:space-between; font-size:11px; color:var(--ink-50); padding:0 4px; margin-bottom:4px; }
  input[type=range]{ width:100%; accent-color:var(--teal-600); height:44px; }

  .steps-grid{ display:grid; gap:16px; margin:40px 0 48px; }
  @media(min-width:640px){ .steps-grid{ grid-template-columns:repeat(3,1fr); } }
  .step-card{ background:var(--paper); border:1px solid var(--ink-10); border-radius:var(--radius-xl); padding:20px; }
  .step-card .num{ font-family:"Fraunces",serif; font-size:30px; color:var(--marigold-500); }
  .step-card h3{ font-size:16px; margin-top:8px; }
  .step-card p{ font-size:14px; color:var(--ink-60); margin-top:4px; line-height:1.5; }

  .section-head{ display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:16px; }
  .section-head h2{ font-size:24px; font-weight:600; }
  .section-head p{ font-size:14px; color:var(--ink-50); margin-top:4px; }
  .see-all{ display:none; align-items:center; gap:4px; font-size:14px; font-weight:600; color:var(--teal-700); background:none; border:none; }
  @media(min-width:640px){ .see-all{ display:inline-flex; } }

  .tutor-grid{ display:grid; gap:16px; grid-template-columns:1fr; }
  @media(min-width:640px){ .tutor-grid{ grid-template-columns:1fr 1fr; } }
  @media(min-width:1024px){ .tutor-grid{ grid-template-columns:1fr 1fr 1fr; } }

  /* ---------- Tutor card (ID-card / admit-card signature) ---------- */
  .tutor-card{ position:relative; background:var(--paper); border-radius:var(--radius-xl); border:1px solid var(--ink-10); box-shadow:var(--shadow-card); overflow:hidden; }
  .tutor-card::before{ content:""; position:absolute; left:76px; top:0; bottom:0; width:0; border-left:2px dashed var(--ink-15); }
  @media(max-width:640px){ .tutor-card::before{ display:none; } }
  .perf-notch{ position:absolute; left:68px; width:16px; height:16px; border-radius:999px; background:var(--cream); }
  .perf-notch.top{ top:-8px; } .perf-notch.bottom{ bottom:-8px; }
  @media(max-width:640px){ .perf-notch{ display:none; } }
  .tutor-card-body{ padding:16px; display:flex; gap:14px; }
  @media(min-width:640px){ .tutor-card-body{ padding:20px; } }
  .avatar{ border-radius:999px; display:flex; align-items:center; justify-content:center; font-family:"Fraunces",serif; font-weight:600; flex-shrink:0; box-shadow:0 0 0 2px #fff; }
  .avatar.md{ width:56px; height:56px; font-size:18px; }
  .avatar.lg{ width:80px; height:80px; font-size:26px; }
  .avatar.sm{ width:48px; height:48px; font-size:16px; }
  .tc-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
  .tc-name{ font-size:16px; font-weight:600; line-height:1.2; }
  .tc-sub{ font-size:12px; color:var(--ink-50); margin-top:2px; }
  .verified-badge{ transform:rotate(-8deg); flex-shrink:0; display:inline-flex; align-items:center; gap:4px; font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:var(--marigold-700); border:1px solid var(--marigold-300); background:var(--marigold-50); border-radius:999px; padding:4px 8px; }
  .tc-subjects{ font-size:14px; color:var(--ink-70); margin-top:8px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tc-bio{ font-size:12px; color:var(--ink-50); margin-top:4px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .tc-meta{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .rating-row{ display:flex; align-items:center; gap:6px; }
  .stars{ display:flex; gap:2px; color:var(--marigold-500); }
  .stars svg{ width:14px; height:14px; }
  .stars svg.off{ opacity:.25; }
  .rating-text{ font-size:12px; color:var(--ink-50); }
  .fee{ font-weight:600; color:var(--teal-700); }
  .tc-cta{ margin-top:12px; width:100%; }
  @media(min-width:640px){ .tc-cta{ width:auto; padding:10px 20px; } }

  /* ---------- Search results ---------- */
  .crumbs{ display:flex; align-items:center; gap:8px; font-size:14px; color:var(--ink-50); margin-bottom:16px; }
  .crumbs button{ background:none; border:none; display:inline-flex; align-items:center; gap:4px; color:inherit; font-size:inherit; }
  .crumbs button:hover{ color:var(--teal-700); }
  .results-head{ display:flex; flex-direction:column; gap:12px; margin-bottom:20px; }
  @media(min-width:640px){ .results-head{ flex-direction:row; align-items:flex-end; justify-content:space-between; } }
  .results-head h1{ font-size:26px; font-weight:600; }
  @media(min-width:640px){ .results-head h1{ font-size:30px; } }
  .results-head .count{ font-size:14px; color:var(--ink-50); margin-top:4px; }
  .results-controls{ display:flex; align-items:center; gap:8px; }
  select.sort{ padding:9px 12px; border-radius:10px; background:var(--paper); border:1px solid var(--ink-10); font-size:14px; }
  .filters-toggle{ display:inline-flex; }
  @media(min-width:640px){ .filters-toggle{ display:none; } }

  .results-layout{ display:grid; gap:24px; grid-template-columns:1fr; }
  @media(min-width:640px){ .results-layout{ grid-template-columns:260px 1fr; } }
  .filters-panel{ display:none; background:var(--paper); border:1px solid var(--ink-10); border-radius:var(--radius-xl); padding:20px; height:fit-content; position:sticky; top:80px; }
  @media(min-width:640px){ .filters-panel{ display:block; } }
  .filters-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .filters-head h3{ font-size:16px; }
  .filters-head button{ background:none; border:none; font-size:12px; font-weight:600; color:var(--teal-700); }
  .filter-block{ margin-bottom:20px; }
  .filter-block label.field-title{ font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-50); display:block; margin-bottom:8px; }
  .filter-block select{ width:100%; padding:10px 12px; border-radius:10px; background:var(--cream); border:1px solid var(--ink-10); font-size:14px; }
  .range-row{ display:flex; justify-content:space-between; font-size:12px; }
  .checkbox-row{ display:flex; align-items:center; gap:10px; font-size:14px; color:var(--ink-70); padding:6px 0; }
  .checkbox-row input{ width:16px; height:16px; accent-color:var(--teal-600); }
  .filters-footer{ padding-top:16px; border-top:1px solid var(--ink-10); font-size:12px; color:var(--ink-40); }
  .results-list{ display:flex; flex-direction:column; gap:16px; }
  .empty-state{ background:var(--paper); border:1px solid var(--ink-10); border-radius:var(--radius-xl); padding:32px; text-align:center; }
  .empty-state p:first-child{ font-family:"Fraunces",serif; font-size:18px; font-weight:600; }
  .empty-state p:last-child{ font-size:14px; color:var(--ink-50); margin-top:4px; }

  .sheet-overlay{ display:none; position:fixed; inset:0; z-index:50; align-items:flex-end; }
  .sheet-overlay.open{ display:flex; }
  .sheet-backdrop{ position:absolute; inset:0; background:rgba(30,43,41,.4); }
  .sheet{ position:relative; width:100%; background:var(--cream); border-radius:20px 20px 0 0; max-height:85vh; overflow-y:auto; padding:16px; padding-bottom:96px; }
  .sheet-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .sheet-head button{ background:none; border:none; padding:4px; }
  @media(min-width:640px){ .sheet-overlay{ display:none !important; } }

  /* ---------- Profile ---------- */
  .back-link{ display:inline-flex; align-items:center; gap:4px; background:none; border:none; font-size:14px; color:var(--ink-50); margin-bottom:16px; }
  .back-link:hover{ color:var(--teal-700); }
  .profile-card{ background:var(--paper); border:1px solid var(--ink-10); border-radius:var(--radius-xl); box-shadow:var(--shadow-card); padding:20px; }
  @media(min-width:640px){ .profile-card{ padding:28px; } }
  .profile-top{ display:flex; flex-direction:column; gap:16px; align-items:flex-start; }
  @media(min-width:640px){ .profile-top{ flex-direction:row; align-items:center; } }
  .profile-name-row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .profile-name-row h1{ font-size:24px; font-weight:600; }
  .profile-sub{ font-size:14px; color:var(--ink-60); margin-top:4px; }
  .profile-meta-row{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; font-size:14px; margin-top:8px; }
  .profile-meta-row .pin{ display:flex; align-items:center; gap:4px; color:var(--ink-50); }
  .profile-price{ flex-shrink:0; }
  .profile-price .amt{ font-weight:600; font-size:26px; color:var(--teal-700); }
  .profile-price .per{ font-size:14px; color:var(--ink-40); font-family:"Inter",sans-serif; }
  .info-grid{ display:grid; gap:12px; margin-top:24px; grid-template-columns:1fr; font-size:14px; }
  @media(min-width:640px){ .info-grid{ grid-template-columns:repeat(3,1fr); } }
  .info-box{ background:var(--cream); border-radius:12px; padding:12px; }
  .info-box .lbl{ font-size:11px; color:var(--ink-40); text-transform:uppercase; letter-spacing:.04em; }
  .info-box .val{ font-weight:600; margin-top:2px; }
  .profile-section{ margin-top:24px; }
  .profile-section h2{ font-size:18px; font-weight:600; margin-bottom:8px; }
  .about-box{ font-size:14px; color:var(--ink-70); line-height:1.6; background:var(--paper); border:1px solid var(--ink-10); border-radius:var(--radius-xl); padding:20px; }
  .achieve-grid{ display:grid; gap:12px; grid-template-columns:1fr; }
  @media(min-width:640px){ .achieve-grid{ grid-template-columns:1fr 1fr; } }
  .achieve-item{ display:flex; gap:10px; align-items:flex-start; background:var(--paper); border:1px solid var(--ink-10); border-radius:12px; padding:14px; }
  .achieve-item .tick{ width:20px; height:20px; border-radius:999px; background:var(--teal-50); color:var(--teal-700); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .achieve-item p{ font-size:14px; color:var(--ink-70); line-height:1.4; margin:0; }
  .review-item{ background:var(--paper); border:1px solid var(--ink-10); border-radius:12px; padding:14px; margin-bottom:12px; }
  .review-item .row{ display:flex; justify-content:space-between; align-items:center; }
  .review-item .name{ font-weight:600; font-size:14px; }
  .review-item .text{ font-size:14px; color:var(--ink-60); margin-top:6px; line-height:1.5; }
  .review-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .review-head .rating-summary{ display:flex; align-items:center; gap:6px; font-size:14px; color:var(--ink-60); }
  .sticky-book{ display:flex; position:fixed; bottom:64px; left:0; right:0; z-index:30; background:var(--paper); border-top:1px solid var(--ink-10); padding:12px 16px; align-items:center; justify-content:space-between; }
  @media(min-width:640px){ .sticky-book{ display:none; } }

  /* ---------- Booking ---------- */
  .tutor-strip{ display:flex; align-items:center; gap:12px; background:var(--paper); border:1px solid var(--ink-10); border-radius:var(--radius-xl); padding:16px; margin-bottom:24px; }
  .tutor-strip .name{ font-weight:600; }
  .tutor-strip .sub{ font-size:12px; color:var(--ink-50); }
  .step-dots{ display:flex; align-items:center; gap:8px; margin-bottom:24px; }
  .step-dot{ display:flex; align-items:center; gap:6px; font-size:12px; font-weight:600; color:var(--ink-30); }
  .step-dot.done, .step-dot.active{ color:var(--teal-700); }
  .step-dot .circle{ width:20px; height:20px; border-radius:999px; background:var(--ink-10); color:var(--ink-40); display:flex; align-items:center; justify-content:center; font-size:10px; }
  .step-dot.done .circle{ background:var(--teal-600); color:var(--cream); }
  .step-dot.active .circle{ background:var(--marigold-500); color:var(--teal-900); }
  .step-line{ flex:1; height:1px; background:var(--ink-10); }
  .step-line.done{ background:var(--teal-400); }
  .booking-panel{ background:var(--paper); border:1px solid var(--ink-10); border-radius:var(--radius-xl); padding:20px; }
  .booking-panel h2{ font-size:18px; margin-bottom:12px; }
  .day-scroller{ display:flex; gap:8px; overflow-x:auto; padding-bottom:8px; }
  .day-chip{ flex-shrink:0; width:64px; padding:10px 0; border-radius:12px; border:1px solid var(--ink-10); background:transparent; text-align:center; color:var(--ink-70); }
  .day-chip .dow{ font-size:10px; text-transform:uppercase; letter-spacing:.04em; opacity:.7; }
  .day-chip .dom{ font-family:"Fraunces",serif; font-weight:600; font-size:18px; margin-top:2px; }
  .day-chip.active{ background:var(--teal-600); border-color:var(--teal-600); color:var(--cream); }
  .time-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .time-chip{ padding:10px 0; border-radius:12px; border:1px solid var(--ink-10); background:transparent; font-size:14px; font-weight:500; color:var(--ink-70); }
  .time-chip.active{ background:var(--marigold-500); border-color:var(--marigold-500); color:var(--teal-900); }
  .format-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .format-chip{ padding:8px 16px; border-radius:999px; border:1px solid var(--ink-10); background:transparent; font-size:14px; font-weight:500; color:var(--ink-60); }
  .format-chip.active{ background:var(--teal-50); border-color:var(--teal-300); color:var(--teal-700); }

function nextNDays(n){
  const days=[]; const today=new Date();
  for(let i=1;i<=n;i++){ const d=new Date(today); d.setDate(today.getDate()+i); days.push(d); }
  return days;
}
function formatDate(d){ return d.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'}); }

const App = {

    page: 'home',
    selectedTutorId: TUTORS[0].id,

    mobileFiltersOpen: false,

    dashTab: 'bookings',
  },

  set(patch){ Object.assign(this.state, patch); this.render(); },

  go(page, payload){
    if(page==='auth-student'){ this.state.authRole='student'; page='auth'; }
    if(page==='auth-tutor'){ this.state.authRole='tutor'; page='auth'; }
    if(page==='search' && payload) this.state.searchFilters = Object.assign({subject:'',location:'',maxPrice:1500,formats:[]}, payload);
    if(page==='profile' && payload) this.state.selectedTutorId = payload;
    this.state.page = page;
    this.state.mobileNavOpen = false;
    window.scrollTo(0,0);
    this.render();
  },
  viewTutor(id){ this.state.selectedTutorId = id; this.go('profile'); },
  startBooking(id){
    this.state.selectedTutorId = id;
    this.state.booking = { step:0, dayIdx:0, time:null, format:(TUTORS.find(t=>t.id===id)||TUTORS[0]).formats[0], days: nextNDays(7) };
    this.go('booking');
  },
  toggleMobileNav(){ this.state.mobileNavOpen = !this.state.mobileNavOpen; this.render(); },
  logout(){ this.state.auth = { loggedIn:false, role:null, name:'' }; this.go('home'); },

  render(){ document.getElementById('app').innerHTML = renderApp(this.state); afterRender(this.state); },

/* ============================== RENDER: SHELL ============================== */

function renderTopNav(state){

      <div class="nav-actions">
        ${auth.loggedIn ? `
          <span style="font-size:14px;color:var(--ink-60)">Hi, ${esc(auth.name.split(' ')[0])}</span>
          <button class="nav-link fring" onclick="App.logout()">Log out</button>

          <button class="btn btn-primary fring" style="padding:10px 18px" onclick="App.go('auth-student')">Sign up</button>

      </div>
      <button class="hamburger fring" onclick="App.toggleMobileNav()" aria-label="Menu">${mobileNavOpen ? ICON.close : ICON.menu}</button>

    <div class="mobile-menu ${mobileNavOpen?'open':''}">

      <button class="mobile-menu-item fring" onclick="App.go('auth-tutor')">Become a tutor</button>
      ${auth.loggedIn && auth.role==='tutor' ? `<button class="mobile-menu-item fring" onclick="App.go('dashboard')">Dashboard</button>` : ''}
      <div class="mobile-menu-row">
        ${auth.loggedIn
          ? `<button class="btn btn-outline btn-block fring" onclick="App.logout()">Log out</button>`
          : `<button class="btn btn-outline btn-block fring" onclick="App.go('auth-student')">Log in</button>
             <button class="btn btn-primary btn-block fring" onclick="App.go('auth-student')">Sign up</button>`}
      </div>
    </div>
  </header>`;
}

function renderTabBar(state){
  const { page, auth } = state;
  const dashTarget = auth.loggedIn && auth.role==='tutor' ? 'dashboard' : 'auth-tutor';
  const isActive = (k) => page===k || (k==='auth-student' && page==='auth');
  const items = [
    ['home','Home',ICON.home], ['search','Search',ICON.search],
    [dashTarget,'Dashboard',ICON.grid], ['auth-student','Account',ICON.user],
  ];
  return `<nav class="tabbar">
    ${items.map(([key,label,icon]) => `<button class="fring ${isActive(key)?'active':''}" onclick="App.go('${key}')">${icon}${label}</button>`).join('')}
  </nav>`;
}

function renderFooter(){
  return `<footer>
    <div class="container footer-grid">
      <div>
        <span class="logo" style="padding:0">Class<span>hub</span></span>
        <p class="footer-desc">Chennai's marketplace for verified tutors and tuition centers — clear pricing, real reviews, reliable payouts.</p>
      </div>
      <div><h4>For students &amp; parents</h4><ul><li>How Classhub works</li><li>Popular subjects near you</li><li>Safety &amp; verification</li></ul></div>
      <div><h4>For tutors &amp; centers</h4><ul><li>List your classes</li><li>Getting paid on time</li><li>Tutor success stories</li></ul></div>
    </div>
    <div class="footer-bottom">© 2026 Classhub. Made for students, tutors and tuition centers in Chennai.</div>
  </footer>`;
}

function renderApp(state){
  let page;
  if(state.page==='home') page = renderHome(state);
  else if(state.page==='search') page = renderSearch(state);
  else if(state.page==='profile') page = renderProfile(state);
  else if(state.page==='booking') page = renderBooking(state);
  else if(state.page==='auth') page = renderAuth(state);
  else if(state.page==='dashboard') page = renderDashboard(state);
  else page = renderHome(state);

  return `
    ${renderTopNav(state)}
    <main>${page}</main>
    ${state.page!=='booking' ? renderFooter() : ''}
    ${renderTabBar(state)}
    <div class="tabbar-spacer"></div>
  `;
}

function filterTutors(filters, sort){
  let list = TUTORS.filter(t=>{
    if(filters.subject && !t.subjects.includes(filters.subject)) return false;
    if(filters.location && t.location !== filters.location) return false;
    if(t.fee > filters.maxPrice) return false;
    if(filters.formats.length && !filters.formats.some(f=>t.formats.includes(f))) return false;
    return true;
  });
  if(sort==='rating') list = list.slice().sort((a,b)=>b.rating-a.rating);
  if(sort==='price-asc') list = list.slice().sort((a,b)=>a.fee-b.fee);
  if(sort==='price-desc') list = list.slice().sort((a,b)=>b.fee-a.fee);
  return list;
}

Object.assign(App, {
  setBooking(patch){ Object.assign(this.state.booking, patch); this.render(); },
  confirmDetails(){
    const name = document.getElementById('bk-name').value.trim();
    const phone = document.getElementById('bk-phone').value.trim();
    if(name.length < 2 || phone.length < 10){
      alert('Please enter the student name and a 10-digit phone number.');
      return;
    }
    this.state.booking.studentName = name;
    this.state.booking.phone = phone;
    this.state.booking.notes = document.getElementById('bk-notes').value.trim();
    this.state.booking.step = 2;
    this.render();
  },
  pay(){
    const t = TUTORS.find(x=>x.id===this.state.selectedTutorId) || TUTORS[0];
    const btn = document.getElementById('pay-btn');
    if(btn){ btn.disabled = true; btn.textContent = 'Opening Razorpay…'; }
    const amountPaise = t.fee * 100;

    // Razorpay test-mode checkout. The public Razorpay sample test key is used
    // here since there's no backend order yet — swap in your own test key
    // (and create a real order server-side) before going live.
    const options = {
      key: 'rzp_test_1DP5mmOlF5G5ag',
      amount: amountPaise,
      currency: 'INR',
      name: 'Classhub',
      description: t.subjects[0] + ' session with ' + t.name,
      handler: () => { this.finishPayment(); },
      modal: { ondismiss: () => { if(btn){ btn.disabled=false; btn.textContent = 'Pay ' + rupees(t.fee) + ' with Razorpay'; } } },
      prefill: { name: this.state.booking.studentName || '', contact: this.state.booking.phone || '' },
      theme: { color: '#0F5652' },
    };

    try{
      if(window.Razorpay){
        const rzp = new window.Razorpay(options);
        if(rzp.on) rzp.on('payment.failed', () => { if(btn){ btn.disabled=false; btn.textContent = 'Pay ' + rupees(t.fee) + ' with Razorpay'; } });
        rzp.open();
      } else {
        setTimeout(() => this.finishPayment(), 900);
      }
    } catch(e){
      setTimeout(() => this.finishPayment(), 900);
    }
  },
  finishPayment(){
    this.state.booking.bookingId = 'CH' + Math.floor(100000 + Math.random()*900000);
    this.state.booking.step = 3;
    this.render();
  },
});

      <p>Tutor dashboard is for tutors &amp; centers</p>
      <p>Log in with a tutor or center account to manage bookings and earnings.</p>
      <button class="btn btn-primary fring" style="margin-top:20px" onclick="App.go('auth-tutor')">Log in as tutor / center</button>
    </div>`;
  }

  const tabs = [['bookings','Bookings'],['earnings','Earnings'],['profile','Edit profile']];
  const t = TUTORS[0];

  let body = '';
  if(state.dashTab==='bookings'){
    body = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <h2 style="font-size:18px">Incoming bookings</h2><span style="font-size:12px;color:var(--ink-50)">${MOCK_BOOKINGS.length} total</span>
    </div>
    ${MOCK_BOOKINGS.map(b=>`
      <div class="booking-row">
        <div><div class="who">${esc(b.studentName)}</div><div class="what">${esc(b.subject)} · ${b.date}, ${b.time}</div></div>
        <div style="text-align:right"><span class="status-pill status-${b.status}">${b.status}</span><div class="mono fee" style="margin-top:4px">${rupees(b.amount)}</div></div>
      </div>`).join('')}`;
  } else if(state.dashTab==='earnings'){
    const received = MOCK_BOOKINGS.filter(b=>b.status==='Completed').reduce((s,b)=>s+b.amount,0);
    const pending = MOCK_BOOKINGS.filter(b=>b.status!=='Completed').reduce((s,b)=>s+b.amount,0);
    const pendingCount = MOCK_BOOKINGS.filter(b=>b.status!=='Completed').length;
    body = `
    <h2 style="font-size:18px;margin-bottom:12px">Earnings summary</h2>
    <div class="earnings-grid">
      <div class="earn-card received"><div class="lbl">Total received</div><div class="amt mono">${rupees(received)}</div><div class="sub">this month</div></div>
      <div class="earn-card pending"><div class="lbl">Pending payout</div><div class="amt mono">${rupees(pending)}</div><div class="sub">across ${pendingCount} bookings</div></div>
    </div>
    <p style="font-size:12px;color:var(--ink-40);margin-top:16px;line-height:1.5">Payouts settle to your linked bank account 2 business days after a completed, confirmed session.</p>`;
  } else {
    body = `
    <h2 style="font-size:18px;margin-bottom:12px">Edit your public profile</h2>
    <form class="booking-panel" onsubmit="App.saveProfile(event)">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">
        ${avatar(t.name,0,'md')}
        <div><p style="font-weight:600;font-family:'Fraunces',serif">${esc(t.name)}</p><p style="font-size:12px;color:var(--ink-50)">${esc(t.location)} · ${esc(t.kind)}</p></div>
      </div>
      <div class="form-field"><label>Bio</label><textarea rows="4">${esc(t.bio)}</textarea></div>
      <div class="form-field"><label>Subjects (comma separated)</label><input value="${esc(t.subjects.join(', '))}"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="form-field"><label>Fee (₹/hr)</label><input class="mono" value="${t.fee}"></div>
        <div class="form-field"><label>Format</label>
          <select>${FORMATS.map(f=>`<option ${t.formats[0]===f?'selected':''}>${esc(f)}</option>`).join('')}</select>
        </div>
      </div>
      <div class="form-field"><label>Availability</label><input value="Weekdays 4–8 PM, Saturdays 9 AM–1 PM"></div>
      <div style="display:flex;align-items:center;gap:12px">
        <button type="submit" class="btn btn-primary fring">Save changes</button>
        <span id="save-confirm" style="font-size:14px;color:var(--teal-700);font-weight:500;display:none">✓ Saved</span>
      </div>
    </form>`;
  }

  return `
  <div class="container" style="max-width:720px;padding-top:24px;padding-bottom:80px">
    <h1 style="font-size:26px;font-weight:600">Your dashboard</h1>
    <p style="font-size:14px;color:var(--ink-50);margin-top:4px">Manage bookings, payouts and your public profile.</p>
    <div class="dash-tabs">
      ${tabs.map(([k,l])=>`<button class="fring ${state.dashTab===k?'active':''}" onclick="App.setDashTab('${k}')">${l}</button>`).join('')}
    </div>
    ${body}
  </div>`;
}

Object.assign(App, {
  setDashTab(k){ this.state.dashTab = k; this.render(); },
  saveProfile(e){
    e.preventDefault();
    const el = document.getElementById('save-confirm');
    if(el){ el.style.display='inline'; setTimeout(()=>{ el.style.display='none'; }, 2500); }
  },
});

/* ============================== INIT ============================== */
function afterRender(state){ /* reserved for post-render focus/scroll handling if needed */ }
App.render();
</script>
</body>
</html>
